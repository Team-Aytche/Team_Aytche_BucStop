# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - bucstop

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_07d9fe43d6e245a9aac28a4801b0c777 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_7028b26c2dad42bb95bb001c5c1bb1ce }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_07d9fe43d6e245a9aac28a4801b0c777 }}/bucstop:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'bucstop'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_f505c956c47543f88e4da8805b8ce3b9 }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_07d9fe43d6e245a9aac28a4801b0c777 }}/bucstop:${{ github.sha }}'