# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - bucstop

on:
  push:
    branches:
      - test
  workflow_dispatch:

jobs:
  build:
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@v2

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Log in to registry
      uses: docker/login-action@v2
      with:
        registry: https://index.docker.io/v1/
        username: ${{ secrets.AzureAppService_ContainerUsername_cd372318b23a40c49386c3420531c5a2 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_61b2fca1e1864184bdbc980f48a1ffcf }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@v3
      with:
        push: true
        tags: index.docker.io/${{ secrets.AzureAppService_ContainerUsername_cd372318b23a40c49386c3420531c5a2 }}/bucstop:${{ github.sha }}
        file: ./Dockerfile

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'bucstop'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_c28e4bc3203b4f7eb81cc8f20793c1ee }}
        images: 'index.docker.io/${{ secrets.AzureAppService_ContainerUsername_cd372318b23a40c49386c3420531c5a2 }}/bucstop:${{ github.sha }}'